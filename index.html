<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>ダッシュボード — 高岡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16171b;
    --panel:#1e2026;
    --ink:#f2f1ec;
    --ink2:#b9bcc2;
    --ink3:#7e828b;
    --line:#33363e;
    --hi:#ff8a70;
    --lo:#7db4ff;
    --rain:#6fc3ff;
    --dial:min(60vw, 54vh, 520px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(18px,3.5vh,34px);
    padding:clamp(16px,4vh,40px) 16px 8px;
  }

  /* ---------- analog clock with An inside the dial ---------- */
  .clock{
    position:relative;
    width:var(--dial);
    height:var(--dial);
    flex:none;
    border-radius:50%;
    /* brushed-metal rim like the reference photo */
    background:linear-gradient(145deg,#d8d8d2,#a9aaa2 55%,#c9c9c2);
    padding:min(1.6vw,10px);
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.5);
  }
  .dial{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    overflow:hidden;
    background:#f7f2df; /* cream dial */
  }
  /* An fills the whole dial. Normal flow + explicit parent size
     (no aspect-ratio / absolute-position sizing: old tablet browsers
     collapse that combination). */
  .dial video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
  }
  .dial svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  /* ---------- date ---------- */
  .date-line{
    margin:0;
    font-size:clamp(26px,5.6vw,40px);
    font-weight:700;
    letter-spacing:.04em;
    text-align:center;
  }
  .date-line .dow{color:var(--ink2)}

  /* ---------- weather ---------- */
  .wx{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(10px,2vh,18px);
    text-align:center;
  }
  .wx-main{display:flex;align-items:center;gap:clamp(12px,3vw,20px)}
  .wx-icon{width:clamp(56px,13vw,84px);height:clamp(56px,13vw,84px);flex:none}
  .wx-cond{font-size:clamp(26px,6vw,42px);font-weight:700;line-height:1.25}
  .wx-nums{
    display:flex;
    align-items:baseline;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px clamp(18px,5vw,34px);
    font-variant-numeric:tabular-nums;
  }
  .wx-item{display:flex;align-items:baseline;gap:8px}
  .wx-label{font-size:clamp(15px,3.4vw,21px);color:var(--ink2);font-weight:500}
  .wx-val{font-size:clamp(32px,7.5vw,52px);font-weight:900;line-height:1}
  .wx-val small{font-size:.45em;font-weight:700}
  .wx-val.hi{color:var(--hi)}
  .wx-val.lo{color:var(--lo)}
  .wx-val.rain{color:var(--rain)}
  .wx-note{margin:0;font-size:12px;color:var(--ink3)}

  /* ---------- controls (small, bottom) ---------- */
  footer{
    width:100%;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .controls{display:flex;gap:8px;justify-content:center}
  .btn{
    appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink2);
    padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;line-height:1;
  }
  .btn:active{transform:scale(.98)}
  .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn svg{width:14px;height:14px;flex:none}
  .ctl-notice{
    max-width:640px;
    font-size:12.5px;line-height:1.6;border-radius:10px;padding:10px 13px;
    background:var(--panel);border:1px solid var(--line);color:var(--ink2);
  }
  .ctl-notice b{color:var(--ink)}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>

  var anVideo = document.getElementById('anVideo');
  var anMode = ''; // 'day' | 'night'
  function tryPlay(){ try{ var p = anVideo.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} }
  function setAnMode(mode){
    if(!anVideo || mode === anMode) return;
    anMode = mode;
    anVideo.src = (mode === 'night') ? NIGHT_SRC : DAY_SRC;
    try{ anVideo.load(); }catch(e){}
    tryPlay();
  }
  if(anVideo){
    anVideo.addEventListener('canplay', tryPlay);
    // If the published night video is not reachable yet, fall back to the
    // bundled copy; if that also fails, stay on the day video.
    anVideo.addEventListener('error', function(){
      if(anMode === 'night' && anVideo.getAttribute('src') === NIGHT_SRC){
        anVideo.src = NIGHT_LOCAL;
        try{ anVideo.load(); }catch(e){}
        tryPlay();
      } else if(anMode === 'night'){
        anMode = '';
        setAnMode('day');
      }
    }, true);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) tryPlay(); });
  }

  /* ---------- clock + date tick ---------- */
  function tick(){
    var t = tokyoParts();
    var mDeg = (t.m + t.s/60) * 6;
    var hDeg = ((t.h % 12) + t.m/60) * 30;
    if(handM) handM.setAttribute('transform', 'rotate(' + mDeg.toFixed(2) + ' 100 100)');
    if(handH) handH.setAttribute('transform', 'rotate(' + hDeg.toFixed(2) + ' 100 100)');
    if(dateMain) dateMain.innerHTML = t.mo + '月' + t.d + '日 <span class="dow">（' + t.dow + '）</span>';
    var night = (t.h >= 21 || t.h < 7);
    setAnMode(night ? 'night' : 'day');
  }
  tick();
  setInterval(tick, 1000);   // hands every second; day/night re-checked each tick (well within the 1-minute requirement)

  /* ---------- weather : Open-Meteo, Takaoka, today ---------- */
  var wxIcon = document.getElementById('wxIcon');
  var wxCond = document.getElementById('wxCond');
  var wxHi = document.getElementById('wxHi');
  var wxLo = document.getElementById('wxLo');
  var wxPop = document.getElementById('wxPop');
  var wxNote = document.getElementById('wxNote');

  var SUN = '<svg viewBox="0 0 96 96" width="100%" height="100%" aria-hidden="true"><circle cx="48" cy="48" r="17" fill="#f5b04a"/><g stroke="#f5b04a" stroke-width="5" stroke-linecap="round"><path d="M48 14v8M48 74v8M14 48h8M74 48h8M24 24l6 6M66 66l6 6M72 24l-6 6M30 66l-6 6"/></g></svg>';
  var SUN_CLOUD = '<svg viewBox="0 0 96 96" width="100%" height="100%" aria-hidden="true"><circle cx="36" cy="34" r="13" fill="#f5b04a"/><g stroke="#f5b04a" stroke-width="4" stroke-linecap="round"><path d="M36 10v5M13 34h5M19 17l3.5 3.5M53 17l-3.5 3.5"/></g><path d="M30 80h46a13 13 0 0 0 2-25.8A22 22 0 0 0 37 62a15 15 0 0 0-7 18z" fill="#c3c9d4"/></svg>';
  var CLOUD = '<svg viewBox="0 0 96 96" width="100%" height="100%" aria-hidden="true"><path d="M24 76h50a15 15 0 0 0 2-29.7A25 25 0 0 0 28 54a17 17 0 0 0-4 22z" fill="#c3c9d4"/></svg>';
  var FOG = '<svg viewBox="0 0 96 96" width="100%" height="100%" aria-hidden="true"><path d="M24 58h50a15 15 0 0 0 2-29.7A25 25 0 0 0 28 36a17 17 0 0 0-4 22z" fill="#c3c9d4"/><g stroke="#9aa1ad" stroke-width="5" stroke-linecap="round"><path d="M24 70h48M30 82h36"/></g></svg>';
  var RAIN = '<svg viewBox="0 0 96 96" width="100%" height="100%" aria-hidden="true"><path d="M24 62h50a15 15 0 0 0 2-29.7A25 25 0 0 0 28 40a17 17 0 0 0-4 22z" fill="#c3c9d4"/><g stroke="#6fc3ff" stroke-width="5" stroke-linecap="round"><path d="M34 72l-3 9M50 72l-3 9M66 72l-3 9"/></g></svg>';
  var SNOW = '<svg viewBox="0 0 96 96" width="100%" height="100%" aria-hidden="true"><path d="M24 60h50a15 15 0 0 0 2-29.7A25 25 0 0 0 28 38a17 17 0 0 0-4 22z" fill="#c3c9d4"/><g fill="#eef4ff"><circle cx="33" cy="74" r="3.4"/><circle cx="49" cy="80" r="3.4"/><circle cx="65" cy="74" r="3.4"/></g></svg>';
  var THUNDER = '<svg viewBox="0 0 96 96" width="100%" height="100%" aria-hidden="true"><path d="M24 60h50a15 15 0 0 0 2-29.7A25 25 0 0 0 28 38a17 17 0 0 0-4 22z" fill="#c3c9d4"/><path d="M50 58 38 82h9l-4 12 16-26h-10l5-10z" fill="#f5b04a"/></svg>';

  function wxFor(code){
    if(code === 0) return {label:'晴れ', icon:SUN};
    if(code === 1) return {label:'晴れ時々くもり', icon:SUN_CLOUD};
    if(code === 2) return {label:'くもり時々晴れ', icon:SUN_CLOUD};
    if(code === 3) return {label:'くもり', icon:CLOUD};
    if(code === 45 || code === 48) return {label:'霧', icon:FOG};
    if(code >= 51 && code <= 57) return {label:'小雨', icon:RAIN};
    if((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return {label:'雨', icon:RAIN};
    if((code >= 71 && code <= 77) || code === 85 || code === 86) return {label:'雪', icon:SNOW};
    if(code >= 95) return {label:'雷雨', icon:THUNDER};
    return {label:'—', icon:CLOUD};
  }

  var WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=36.754&longitude=137.017&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo';
  function loadWeather(){
    if(!window.fetch) return;
    fetch(WX_URL, {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){
        var d = j && j.daily;
        if(!d) throw new Error('no daily');
        var info = wxFor(d.weather_code[0]);
        wxCond.textContent = info.label;
        wxIcon.innerHTML = info.icon;
        wxHi.textContent = Math.round(d.temperature_2m_max[0]);
        wxLo.textContent = Math.round(d.temperature_2m_min[0]);
        var pop = d.precipitation_probability_max ? d.precipitation_probability_max[0] : null;
        wxPop.textContent = (pop === null || pop === undefined) ? '—' : Math.round(pop);
        var now = new Date();
        function p2(n){ return (n<10?'0':'')+n; }
        wxNote.textContent = '高岡市の今日の天気（Open-Meteo ・ ' + p2(now.getHours()) + ':' + p2(now.getMinutes()) + ' 取得）';
      })
      .catch(function(){
        // Quiet failure: keep whatever is on screen (last values or —).
        if(wxCond.textContent === '読み込み中…') wxCond.textContent = '天気を取得できませんでした';
      });
  }
  loadWeather();
  setInterval(loadWeather, 60*60*1000);

  /* ---------- control feedback ---------- */
  var ctlNotice = document.getElementById('ctlNotice');
  var noticeTimer = null;
  function showNotice(html, sticky){
    if(!ctlNotice) return;
    ctlNotice.innerHTML = html;

    if(noticeTimer){ clearTimeout(noticeTimer); noticeTimer = null; }
    if(!sticky){ noticeTimer = setTimeout(function(){ ctlNotice.hidden = true; }, 12000); }
  }

  /* ---------- fullscreen ---------- */
  var btnFull = document.getElementById('btnFull');

  var fsBlocked = (document.fullscreenEnabled === false);
  function fsActive(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function syncFullLabel(){
    if(!fullLabel) return;
    fullLabel.textContent = fsActive() ? '全画面を終了' : (fsBlocked ? '全画面の方法' : '全画面');
  }
  document.addEventListener('fullscreenchange', syncFullLabel);
  document.addEventListener('webkitfullscreenchange', syncFullLabel);
  syncFullLabel();
  function showFullscreenGuide(){
    showNotice('<b>この表示では全画面ボタンは使えません。</b> ページが Muse の画面の中に埋め込まれているためです。全画面で置きっぱなしにしたい場合は、無料アプリ <b>Fully Kiosk Browser</b>（Playストア）でこのページを開くのが確実です（アプリ側で全画面表示と消灯防止が設定できます）。', true);
  }
  btnFull.addEventListener('click', function(){
    if(fsActive()){
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if(ex) ex.call(document);
      return;
    }
    if(fsBlocked){ showFullscreenGuide(); return; }
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(!req){ showFullscreenGuide(); return; }
    try{
      var r = req.call(el);
      if(r && r.catch){ r.catch(showFullscreenGuide); }
      else { setTimeout(function(){ if(!fsActive()) showFullscreenGuide(); }, 400); }
    }catch(e){ showFullscreenGuide(); }
  });

  /* ---------- keep-awake (Wake Lock, with silent-video fallback) ---------- */
  var btnWake = document.getElementById('btnWake');
  var wakeLabel = document.getElementById('wakeLabel');
  var wakeLock = null;
  var wakeVideo = null;
  var wakeDrawTimer = null;
  var wakeWanted = false;

  function setWakeUI(on, mode){
    btnWake.setAttribute('aria-pressed', on ? 'true' : 'false');
    wakeLabel.textContent = !on ? '画面をつけたまま' : (mode === 'video' ? 'つけたまま ON（代替方式）' : 'つけたまま ON');
  }
  function stopVideoFallback(){
    if(wakeDrawTimer){ clearInterval(wakeDrawTimer); wakeDrawTimer = null; }
    if(wakeVideo){
      try{ wakeVideo.pause(); }catch(e){}
      try{ wakeVideo.srcObject = null; }catch(e){}
      if(wakeVideo.parentNode) wakeVideo.parentNode.removeChild(wakeVideo);
      wakeVideo = null;
    }
  }
  function wakeOff(silent){
    wakeWanted = false;
    if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
    stopVideoFallback();
    setWakeUI(false);
    if(!silent && ctlNotice) ctlNotice.hidden = true;
  }
  function startVideoFallback(){
    if(!document.createElement('canvas').captureStream) return false;
    var canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    var ctx = canvas.getContext('2d');
    var hue = 0;
    function draw(){ hue = (hue + 40) % 360; ctx.fillStyle = 'hsl(' + hue + ',40%,40%)'; ctx.fillRect(0, 0, 32, 32); }
    draw();
    var stream;
    try{ stream = canvas.captureStream(2); }catch(e){ return false; }
    var v = document.createElement('video');
    v.muted = true; v.loop = true; v.autoplay = true;
    v.setAttribute('playsinline', '');
    v.setAttribute('aria-hidden', 'true');
    v.style.cssText = 'position:fixed;right:4px;bottom:4px;width:6px;height:6px;opacity:.05;pointer-events:none;z-index:1';
    v.srcObject = stream;
    document.body.appendChild(v);
    wakeVideo = v;
    wakeDrawTimer = setInterval(draw, 1000);
    try{
      var p = v.play();
      if(p && p.then){ p.then(function(){}, function(){ stopVideoFallback(); wakeFailed(); }); }
    }catch(e){ stopVideoFallback(); return false; }
    setWakeUI(true, 'video');
    showNotice('<b>画面をつけたまま（代替方式）でONにしました。</b> 小さな映像を再生し続けて消灯を防いでいます。確実に消したくない場合は、タブレット本体の「設定 → システム → 開発者向けオプション → 充電中はスリープしない」も合わせてどうぞ。');
    return true;
  }
  function wakeFailed(){
    if(!wakeWanted) return;
    wakeOff(true);
    showNotice('<b>画面をつけたままにできませんでした。</b> Muse の画面の中に表示されている状態では、ブラウザの制限で消灯防止が禁止されています。確実な方法はタブレット本体の設定です： <b>設定 → システム → 開発者向けオプション →「充電中はスリープしない」をON</b>。', true);
  }
  function requestWakeLock(){
    navigator.wakeLock.request('screen').then(function(lock){
      wakeLock = lock;
      lock.addEventListener('release', function(){
        wakeLock = null;
        if(wakeWanted && !document.hidden){
          if(!wakeVideo && !startVideoFallback()) wakeFailed();
        } else if(!wakeWanted){ setWakeUI(false); }
      });
      setWakeUI(true, 'api');
      showNotice('<b>画面をつけたままにしました。</b> このボタンをもう一度押すと解除されます。');
    }).catch(function(){
      if(!startVideoFallback()) wakeFailed();
    });
  }
  btnWake.addEventListener('click', function(){
    if(wakeWanted){ wakeOff(); return; }
    wakeWanted = true;
    if('wakeLock' in navigator){ requestWakeLock(); }
    else if(!startVideoFallback()){ wakeFailed(); }
  });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && wakeWanted && !wakeLock && !wakeVideo && 'wakeLock' in navigator){ requestWakeLock(); }
    if(!document.hidden && wakeWanted && wakeVideo){ try{ wakeVideo.play(); }catch(e){} }
  });
})();
</script>
</body>
</html>
